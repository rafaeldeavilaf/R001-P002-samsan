:root {
  --fondo: #EEF5FF; --papel: #FFFFFF; --ficha: #FFFFFF; --tinta: #1F2937; --suave: #4B5563; --linea: #1F2937; --sombra: #1F2937;
  --acento: #1D4ED8; --sobre-acento: #FFFFFF; --acento-claro: #DBEAFE; --ok: #15803D; --ok-claro: #DCFCE7;
  --brillo: #F59E0B; --sel: #FBBF24; --sobre-sel: #1F2937; --pool: rgba(255,255,255,.55); --hueco: rgba(255,255,255,.6);
  --pista-fondo: #FEF3C7; --pista-borde: #B45309; --pista-tinta: #1F2937; --estrella-vacia: #FFFFFF;
  --borde: 3px; --radio: 18px; --base: 1.15rem; --etiqueta: 'Nunito', system-ui, sans-serif;
}
html[data-tema="y6"] {
  --fondo: #0B1120; --papel: #111827; --ficha: #1E293B; --tinta: #E2E8F0; --suave: #94A3B8; --linea: #334155; --sombra: #020617;
  --acento: #A3E635; --sobre-acento: #0B1120; --acento-claro: #1A2E05; --ok: #A3E635; --ok-claro: #1A2E05;
  --brillo: #22D3EE; --sel: #22D3EE; --sobre-sel: #0B1120; --pool: rgba(15,23,42,.7); --hueco: rgba(30,41,59,.6);
  --pista-fondo: #2A2205; --pista-borde: #FBBF24; --pista-tinta: #FDE68A; --estrella-vacia: #1E293B;
  --borde: 2px; --radio: 14px; --base: 1.05rem; --etiqueta: 'Press Start 2P', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--tinta); font-family: 'Nunito', system-ui, sans-serif; font-size: var(--base); line-height: 1.4; -webkit-text-size-adjust: 100%; }
html[data-tema="y6"] body {
  background-color: var(--fondo);
  background-image: linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
button { font: inherit; color: inherit; }
.g-raiz { max-width: 760px; margin: 0 auto; padding: 10px 14px 24px; min-height: 100svh; }

/* ---------- barra superior ---------- */
.g-barra { display: flex; align-items: center; gap: 8px; min-height: 52px; margin-bottom: 8px; }
.g-barra h1 { flex: 1; margin: 0; font-size: 1.15rem; font-weight: 900; line-height: 1.15; }
.g-barra h1 small { display: block; font-size: .8rem; font-weight: 700; color: var(--suave); }
html[data-tema="y6"] .g-barra h1 small { font-family: var(--etiqueta); font-size: .5rem; color: #22D3EE; letter-spacing: .06em; margin-top: 5px; line-height: 1.5; text-transform: uppercase; }
.g-icono { min-width: 48px; min-height: 48px; border: var(--borde) solid var(--linea); border-radius: 50%; background: var(--papel); color: var(--tinta); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
html[data-tema="y6"] .g-icono { border-radius: 12px; }
.g-icono svg { width: 24px; height: 24px; }
.g-icono[aria-pressed="false"] { opacity: .5; position: relative; }
.g-icono[aria-pressed="false"]::after { content: ''; position: absolute; width: 60%; height: 3px; background: currentColor; transform: rotate(-45deg); border-radius: 2px; }

/* ---------- botones ---------- */
.g-btn { min-height: 52px; padding: 10px 22px; border: var(--borde) solid var(--linea); border-radius: 999px; background: var(--acento); color: var(--sobre-acento); font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0 var(--sombra); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
html[data-tema="y6"] .g-btn { border-radius: 14px; border-color: transparent; box-shadow: 0 4px 0 #4D7C0F, 0 0 22px rgba(163,230,53,.3); }
.g-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sombra); }
.g-btn--suave { background: var(--papel); color: var(--tinta); }
html[data-tema="y6"] .g-btn--suave { border-color: var(--linea); box-shadow: 0 4px 0 var(--sombra); }
.g-btn--grande { min-height: 64px; font-size: 1.25rem; width: 100%; }
:focus-visible { outline: 4px solid var(--brillo); outline-offset: 2px; }

/* ---------- mascota y globo ---------- */
.g-hola { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; cursor: pointer; }
.g-mascota { width: 112px; height: auto; flex-shrink: 0; overflow: visible; }
.g-mascota--chica { width: 70px; }
.g-globo { position: relative; margin: 0; background: var(--papel); border: var(--borde) solid var(--linea); border-radius: 20px; padding: 10px 14px; font-weight: 800; font-size: 1.05rem; }
.g-globo mark { background: none; color: var(--acento); font-weight: 900; box-shadow: none; padding: 0; }
.g-globo::before { content: ''; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--linea); border-left: 0; }
html[data-tema="y6"] .g-globo { border-color: #22D3EE; box-shadow: 0 0 18px rgba(34,211,238,.22); border-radius: 14px; }
html[data-tema="y6"] .g-globo::before { border-right-color: #22D3EE; }
.g-ojos { transform-box: fill-box; transform-origin: 50% 50%; animation: g-parpadeo 4.2s infinite; }
@keyframes g-parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.g-dron .g-cuerpo { animation: g-flota 2.4s ease-in-out infinite; }
.g-dron .g-propulsor { transform-box: fill-box; transform-origin: 50% 50%; animation: g-pulso 2.4s ease-in-out infinite; }
.g-dron .g-antena { animation: g-led 1.6s steps(2) infinite; }
@keyframes g-flota { 50% { transform: translateY(-6px); } }
@keyframes g-pulso { 50% { transform: scaleX(.8); opacity: .2; } }
@keyframes g-led { 50% { fill: #22D3EE; } }
.g-ala-d { transform-box: fill-box; transform-origin: 20% 80%; }
.g-mascota.salta { animation: g-salto .7s ease; }
.g-mascota.salta .g-ala-d { animation: g-saludo .35s ease-in-out 2 alternate; }
@keyframes g-salto { 30% { transform: translateY(-14px) rotate(-4deg); } 60% { transform: translateY(0); } }
@keyframes g-saludo { to { transform: rotate(-25deg); } }

/* ---------- XP (y6) ---------- */
.g-xp { background: var(--papel); border: var(--borde) solid var(--linea); border-radius: var(--radio); padding: 10px 12px; margin: 0 0 12px; text-align: left; }
.g-xp__fila { display: flex; justify-content: space-between; gap: 8px; font-family: var(--etiqueta); font-size: .55rem; color: var(--suave); margin-bottom: 8px; line-height: 1.6; text-transform: uppercase; }
.g-xp__fila b { color: #A3E635; font-weight: 400; white-space: nowrap; }
.g-xp__barra { height: 14px; border-radius: 7px; background: #1E293B; overflow: hidden; border: 1px solid var(--linea); }
.g-xp__barra i { display: block; height: 100%; background: linear-gradient(90deg, #22D3EE, #A3E635); box-shadow: 0 0 12px #A3E635; transition: width .8s ease; }
.g-xp-gana { font-family: var(--etiqueta); color: #A3E635; font-size: .9rem; margin: 6px 0 !important; text-shadow: 0 0 12px rgba(163,230,53,.6); }
.g-subio { font-family: var(--etiqueta); font-size: .6rem !important; color: #22D3EE; line-height: 1.7; }
.g-insignia { display: inline-flex; flex-direction: column; gap: 4px; padding: 8px 14px; border: 2px solid #FBBF24; border-radius: 12px; background: #2A2205; color: #FDE68A; font-weight: 900; }
.g-insignia small { font-family: var(--etiqueta); font-size: .5rem; font-weight: 400; color: #FBBF24; text-transform: uppercase; }

/* ---------- portada ---------- */
.g-seccion { font-size: 1.5rem; font-weight: 900; margin: 20px 0 0; line-height: 1.1; }
html[data-tema="y6"] .g-seccion { font-family: var(--etiqueta); font-size: .75rem; font-weight: 400; color: #22D3EE; letter-spacing: .08em; }
.g-misiones { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }

/* ============================================================
   SAMSAN — MOTOR DE LAS GUIAS DE ESTUDIO (guias/comun/guia.js)

   Una guia es una lista de misiones (un tema del colegio cada una).
   Cada mision tiene una tarjeta "Aprende" y varias actividades de accion:
     clasificar  llevar cada ficha a su caja
     ordenar     poner las fichas en su orden
     emparejar   unir cada ficha de la izquierda con su pareja
     tocar       tocar en la frase las palabras que se piden (o la que esta mal, para arreglarla)
     completar   llenar los espacios de una frase con fichas
   Las fichas se tocan o se arrastran. No hay opcion multiple ni puntaje
   frente al nino: solo se guarda que actividades se terminaron.

   Variedad (18 nov 2026): cada actividad trae un banco y `muestra` dice

        }
        parte.split(PALABRA).forEach(function (pz, k) {
          if (!pz) return;
