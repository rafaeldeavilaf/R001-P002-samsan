:root {
  --fondo: #EEF5FF; --papel: #FFFFFF; --ficha: #FFFFFF; --tinta: #1F2937; --suave: #4B5563; --linea: #1F2937; --sombra: #1F2937;
  --acento: #1D4ED8; --sobre-acento: #FFFFFF; --acento-claro: #DBEAFE; --ok: #15803D; --ok-claro: #DCFCE7;
  --brillo: #F59E0B; --sel: #FBBF24; --sobre-sel: #1F2937; --pool: rgba(255,255,255,.55); --hueco: rgba(255,255,255,.6);
  --pista-fondo: #FEF3C7; --pista-borde: #B45309; --pista-tinta: #1F2937; --estrella-vacia: #FFFFFF;
  --borde: 3px; --radio: 18px; --base: 1.15rem; --etiqueta: 'Nunito', system-ui, sans-serif;
}
html[data-tema="y6"] {
  --fondo: #0B1120; --papel: #111827; --ficha: #1E293B; --tinta: #E2E8F0; --suave: #94A3B8; --linea: #334155; --sombra: #020617;
  --acento: #A3E635; --sobre-acento: #0B1120; --acento-claro: #1A2E05; --ok: #A3E635; --ok-claro: #1A2E05;
  --brillo: #22D3EE; --sel: #22D3EE; --sobre-sel: #0B1120; --pool: rgba(15,23,42,.7); --hueco: rgba(30,41,59,.6);
  --pista-fondo: #2A2205; --pista-borde: #FBBF24; --pista-tinta: #FDE68A; --estrella-vacia: #1E293B;
  --borde: 2px; --radio: 14px; --base: 1.05rem; --etiqueta: 'Press Start 2P', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--tinta); font-family: 'Nunito', system-ui, sans-serif; font-size: var(--base); line-height: 1.4; -webkit-text-size-adjust: 100%; }
html[data-tema="y6"] body {
  background-color: var(--fondo);
  background-image: linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
button { font: inherit; color: inherit; }
.g-raiz { max-width: 760px; margin: 0 auto; padding: 10px 14px 24px; min-height: 100svh; }

/* ---------- barra superior ---------- */
.g-barra { display: flex; align-items: center; gap: 8px; min-height: 52px; margin-bottom: 8px; }
.g-barra h1 { flex: 1; margin: 0; font-size: 1.15rem; font-weight: 900; line-height: 1.15; }
.g-barra h1 small { display: block; font-size: .8rem; font-weight: 700; color: var(--suave); }
html[data-tema="y6"] .g-barra h1 small { font-family: var(--etiqueta); font-size: .5rem; color: #22D3EE; letter-spacing: .06em; margin-top: 5px; line-height: 1.5; text-transform: uppercase; }
.g-icono { min-width: 48px; min-height: 48px; border: var(--borde) solid var(--linea); border-radius: 50%; background: var(--papel); color: var(--tinta); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
html[data-tema="y6"] .g-icono { border-radius: 12px; }
.g-icono svg { width: 24px; height: 24px; }
.g-icono[aria-pressed="false"] { opacity: .5; position: relative; }
.g-icono[aria-pressed="false"]::after { content: ''; position: absolute; width: 60%; height: 3px; background: currentColor; transform: rotate(-45deg); border-radius: 2px; }

/* ---------- botones ---------- */
.g-btn { min-height: 52px; padding: 10px 22px; border: var(--borde) solid var(--linea); border-radius: 999px; background: var(--acento); color: var(--sobre-acento); font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0 var(--sombra); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
html[data-tema="y6"] .g-btn { border-radius: 14px; border-color: transparent; box-shadow: 0 4px 0 #4D7C0F, 0 0 22px rgba(163,230,53,.3); }
.g-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sombra); }
.g-btn--suave { background: var(--papel); color: var(--tinta); }
html[data-tema="y6"] .g-btn--suave { border-color: var(--linea); box-shadow: 0 4px 0 var(--sombra); }
.g-btn--grande { min-height: 64px; font-size: 1.25rem; width: 100%; }
:focus-visible { outline: 4px solid var(--brillo); outline-offset: 2px; }

/* ---------- mascota y globo ---------- */
.g-hola { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; cursor: pointer; }
.g-mascota { width: 112px; height: auto; flex-shrink: 0; overflow: visible; }
.g-mascota--chica { width: 70px; }
.g-globo { position: relative; margin: 0; background: var(--papel); border: var(--borde) solid var(--linea); border-radius: 20px; padding: 10px 14px; font-weight: 800; font-size: 1.05rem; }
.g-globo mark { background: none; color: var(--acento); font-weight: 900; box-shadow: none; padding: 0; }
.g-globo::before { content: ''; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--linea); border-left: 0; }
html[data-tema="y6"] .g-globo { border-color: #22D3EE; box-shadow: 0 0 18px rgba(34,211,238,.22); border-radius: 14px; }
html[data-tema="y6"] .g-globo::before { border-right-color: #22D3EE; }
.g-ojos { transform-box: fill-box; transform-origin: 50% 50%; animation: g-parpadeo 4.2s infinite; }
@keyframes g-parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.g-dron .g-cuerpo { animation: g-flota 2.4s ease-in-out infinite; }
.g-dron .g-propulsor { transform-box: fill-box; transform-origin: 50% 50%; animation: g-pulso 2.4s ease-in-out infinite; }
.g-dron .g-antena { animation: g-led 1.6s steps(2) infinite; }
@keyframes g-flota { 50% { transform: translateY(-6px); } }
@keyframes g-pulso { 50% { transform: scaleX(.8); opacity: .2; } }
@keyframes g-led { 50% { fill: #22D3EE; } }
.g-ala-d { transform-box: fill-box; transform-origin: 20% 80%; }
.g-mascota.salta { animation: g-salto .7s ease; }
.g-mascota.salta .g-ala-d { animation: g-saludo .35s ease-in-out 2 alternate; }
@keyframes g-salto { 30% { transform: translateY(-14px) rotate(-4deg); } 60% { transform: translateY(0); } }
@keyframes g-saludo { to { transform: rotate(-25deg); } }

/* ---------- XP (y6) ---------- */
.g-xp { background: var(--papel); border: var(--borde) solid var(--linea); border-radius: var(--radio); padding: 10px 12px; margin: 0 0 12px; text-align: left; }
.g-xp__fila { display: flex; justify-content: space-between; gap: 8px; font-family: var(--etiqueta); font-size: .55rem; color: var(--suave); margin-bottom: 8px; line-height: 1.6; text-transform: uppercase; }
.g-xp__fila b { color: #A3E635; font-weight: 400; white-space: nowrap; }
.g-xp__barra { height: 14px; border-radius: 7px; background: #1E293B; overflow: hidden; border: 1px solid var(--linea); }
.g-xp__barra i { display: block; height: 100%; background: linear-gradient(90deg, #22D3EE, #A3E635); box-shadow: 0 0 12px #A3E635; transition: width .8s ease; }
.g-xp-gana { font-family: var(--etiqueta); color: #A3E635; font-size: .9rem; margin: 6px 0 !important; text-shadow: 0 0 12px rgba(163,230,53,.6); }
.g-subio { font-family: var(--etiqueta); font-size: .6rem !important; color: #22D3EE; line-height: 1.7; }
.g-insignia { display: inline-flex; flex-direction: column; gap: 4px; padding: 8px 14px; border: 2px solid #FBBF24; border-radius: 12px; background: #2A2205; color: #FDE68A; font-weight: 900; }
.g-insignia small { font-family: var(--etiqueta); font-size: .5rem; font-weight: 400; color: #FBBF24; text-transform: uppercase; }

/* ---------- portada ---------- */
.g-seccion { font-size: 1.5rem; font-weight: 900; margin: 20px 0 0; line-height: 1.1; }
html[data-tema="y6"] .g-seccion { font-family: var(--etiqueta); font-size: .75rem; font-weight: 400; color: #22D3EE; letter-spacing: .08em; }
.g-misiones { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }

/* ordenar */

.g-hueco { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border: var(--borde) dashed var(--suave); border-radius: 14px; background: var(--hueco); }

/* tocar */

/* ============================================================
   SAMSAN — KIT DE LA ALDEA DE PIP (guias/comun/aldea.css)

.al-pantalla { display: flex; flex-direction: column; height: 100svh; max-width: 1100px; margin: 0 auto; padding: 8px 10px 10px; gap: 8px; }
.al-barra { display: flex; align-items: center; gap: 8px; min-height: 52px; }

/* ---------- escena ---------- */
.al-escena {
  position: relative; flex: 1; min-height: 0; overflow: hidden; container-type: size;
  border: 3px solid #1F2937; border-radius: 22px; background: linear-gradient(var(--cielo-1, #BAE6FD), var(--cielo-2, #F0F9FF));
  --suelo: 28%; --base: 16%; --ancho-lugar: min(23cqw, 27cqh, 180px);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;

@keyframes le-ficha-guia { 0%, 100% { box-shadow: 0 4px 0 #1F2937, 0 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: 0 4px 0 #1F2937, 0 0 0 7px rgba(245,158,11,.65); } }
.le-ficha.al-tiembla { animation: le-tiembla-hueco .55s ease; }
.le-ficha:focus-visible { outline: 4px solid #F59E0B; outline-offset: 3px; }
.le-ficha .al-mano { right: -14px; bottom: -26px; width: 40px; }
.le-ficha--puesta { width: 100%; min-width: 44px; min-height: 64px; transform: none; box-shadow: 0 3px 0 #1F2937; cursor: pointer; padding: 6px 8px; font-size: clamp(1.05rem, 4.5vw, 1.55rem); animation: al-pop .32s cubic-bezier(.3,1.6,.5,1); }
.le-huecos--lista .le-ficha--puesta { background: #DCFCE7; border-color: #16A34A; }
.le-huecos--lista .le-ficha--wh.le-ficha--puesta { background: color-mix(in srgb, var(--c) 20%, #FFFFFF); border-color: var(--c); }
.le-cita { color: #1D4ED8; font-weight: 900; }
.le-par--fichas .le-par__txt span { color: #1F2937; }
@media (orientation: landscape) and (min-width: 700px) {
  .le-pantalla--fichas .le-resp, .le-pantalla--fichas .le-tablero { max-width: 860px; width: 100%; align-self: center; }
  .le-ficha { font-size: 1.7rem; min-height: 64px; padding: 8px 18px; }
  .le-hueco { min-width: 96px; min-height: 66px; }
}
@media (max-width: 520px) { .le-pantalla--fichas .le-dialogo__texto { font-size: clamp(1rem, 4.2vw, 1.3rem); } }
@media (prefers-reduced-motion: reduce) {
  .le-ficha, .le-ficha--puesta { transform: none; animation: none; }

}

<script>
/* ============================================================
   SAMSAN — KIT DE LA ALDEA DE PIP (guias/comun/aldea.js)

   Capa visual del «modo aldea» (Y2 English v3, propuesta del 18 nov 2026).
   Solo dibuja y anima; no lleva reglas de juego, voz ni textos visibles.
   Todo es vector por codigo (sin pixel art y sin archivos): los fondos se
   arman con capas que se estiran bien en vertical y en horizontal, y cada
   lugar es un boton con su propio SVG que se ajusta al alto disponible
   (container queries sobre .al-escena).

   Escenarios (A.escena):
     calle      casas            long i
     estanque   hojas            blends
     plaza      puestos          preguntas Wh
     habitat    arbol, agua, flores
     barrio     edificios        comunidad (panaderia, colegio, hospital, parque)
     granja     gallinero, agua, flores   ciclos de vida

   Lugares (A.lugar): casa, hoja, puesto, arbol, agua, flores, edificio
   (variantes panaderia, colegio, hospital, parque) y gallinero.

   Animaciones:
     A.abrir(lugar, icono)    se abre la puerta, sale el vecino, el dibujo
                              sube con confeti y queda en la ventana
     A.temblar(lugar)         error: tiembla suave, nunca se pierde nada
     A.brillar(lugar)         pista: brilla el lugar correcto
     A.entrar(globo)          Pip llega volando con el globo
     A.volar(globo, lugar)    el globo vuela a la puerta y se encoge
     A.celebrar(pip)          Pip da una voltereta
     A.confeti(x, y, n)       confeti desde un punto de la pantalla

        '<rect x="10" y="28" width="100" height="10" rx="2" fill="' + t.c + '" stroke="' + K + '" stroke-width="3"/>' +
        insignia(34, 64, 14, 2.6, ej, 24, 54, 20, true) +
        '<rect x="62" y="50" width="34" height="30" rx="3" fill="#FEF3C7" stroke="' + K + '" stroke-width="2.6"/>' +
        '<g class="al-ventana" data-x="65" data-y="51" data-l="28"></g>' +
        '<rect x="42" y="112" width="36" height="38" fill="#3B2A20"/>' +
        asomar(t.c, 'gente', 42, 112, 36, 38, 'M42 112 H78 V150 H42 Z') +
        '<g class="al-puerta"><rect x="42" y="112" width="36" height="38" fill="' + t.oscuro + '" stroke="' + K + '" stroke-width="2.6"/><circle cx="72" cy="132" r="2.6" fill="#FDE047" stroke="' + K + '" stroke-width="1.4"/></g>' +
        '<rect x="42" y="112" width="36" height="38" fill="none" stroke="' + K + '" stroke-width="3"/>' + extra;
    },
    parque: function (t, ej) {
      return '<path d="M4 150 C14 136 106 136 116 150 Z" fill="#4ADE80" stroke="' + K + '" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="M22 140 L22 100 M98 140 L98 100" stroke="#92400E" stroke-width="5" stroke-linecap="round"/>' +
        '<circle cx="22" cy="86" r="18" fill="#22C55E" stroke="' + K + '" stroke-width="3"/><circle cx="98" cy="86" r="18" fill="#22C55E" stroke="' + K + '" stroke-width="3"/>' +
        '<path d="M34 64 A26 26 0 0 1 86 64" fill="none" stroke="' + t.oscuro + '" stroke-width="7" stroke-linecap="round"/><path d="M34 64 A26 26 0 0 1 86 64" fill="none" stroke="' + K + '" stroke-width="2" stroke-linecap="round" opacity=".5"/>' +
        '<rect x="30" y="62" width="8" height="80" fill="' + t.oscuro + '" stroke="' + K + '" stroke-width="2.4"/><rect x="82" y="62" width="8" height="80" fill="' + t.oscuro + '" stroke="' + K + '" stroke-width="2.4"/>' +
        insignia(60, 42, 12, 2.4, ej, 51, 33, 18, false) +
        '<g class="al-ventana" data-x="100" data-y="110" data-l="20"></g>' +
        asomar(t.c, 'gente', 40, 92, 40, 50, 'M38 70 H82 V142 H38 Z') +
        '<g class="al-puerta al-puerta--reja"><rect x="38" y="92" width="44" height="50" fill="none"/>' +
        '<path d="M38 96 H82 M38 136 H82 M44 92 V142 M52 92 V142 M60 92 V142 M68 92 V142 M76 92 V142" stroke="' + t.c + '" stroke-width="3.4" stroke-linecap="round"/>' +
        '<path d="M38 96 H82 M38 136 H82" stroke="' + K + '" stroke-width="1.4" opacity=".6"/></g>';
    }
  };

  /* Un lugar: boton con letrero grande arriba y su dibujo.
     op = { id, tipo, variante, color, letrero, ejemplo (icono), etiqueta } */
  A.lugar = function (op) {
    var t = A.tonos(op.color || '#1D4ED8');
    var dib = DIBUJOS[op.tipo] || DIBUJOS.casa;
    var b = el('button', 'al-lugar al-lugar--' + (op.tipo || 'casa') + (op.variante ? ' al-lugar--' + op.variante : ''));
    b.type = 'button';
    b.setAttribute('data-lugar', op.id);
    b.setAttribute('aria-label', op.etiqueta || op.letrero || op.id);
    b.style.setProperty('--c', t.c); b.style.setProperty('--c-oscuro', t.oscuro); b.style.setProperty('--c-claro', t.claro);
    /* recorte de arriba de cada dibujo, para que el letrero quede pegado a el */
    var TOPE = { casa: 8, hoja: 56, puesto: 10, arbol: 6, agua: 58, flores: 18, gallinero: 24, edificio: 26 };
    var VAR = { colegio: -10, hospital: 6, panaderia: 26, parque: 28 };
    var top = op.variante in VAR ? VAR[op.variante] : (TOPE[op.tipo] || 0);
    var largo = (String(op.letrero || '').replace(/\*/g, '').length || 1) + (op.ejemplo ? 1.3 : 0);
    b.style.setProperty('--letrero-k', Math.min(0.25, 0.95 / largo).toFixed(3));
    b.style.setProperty('--letrero-k2', Math.min(0.25, 0.92 / (String(op.letrero || '').replace(/\*/g, '').length || 1)).toFixed(3));
    b.innerHTML = (op.letrero ? '<span class="al-letrero" aria-hidden="true">' + (op.ejemplo ? A.icono(op.ejemplo, 'al-ico al-letrero__ico') : '') + '<span>' + marcas(op.letrero) + '</span></span>' : '') +
      '<svg class="al-dibujo-lugar" viewBox="0 ' + top + ' 120 ' + (150 - top) + '" aria-hidden="true">' + dib(t, op.letrero ? null : op.ejemplo, op.variante) + '</svg>';
    return b;
  };

  /* ============================================================
     ESCENARIOS: capas de fondo que se estiran bien en cualquier pantalla
     ============================================================ */
  function nube(cls) {
    return '<svg class="al-nube ' + cls + '" viewBox="0 0 120 60" aria-hidden="true"><path d="M20 52 C4 52 4 30 22 30 C24 12 50 8 58 24 C66 10 92 14 92 32 C112 30 116 52 100 52 Z" fill="#FFFFFF" stroke="' + K + '" stroke-width="3" stroke-linejoin="round"/></svg>';
  }
  var SOL = '<svg class="al-sol" viewBox="0 0 80 80" aria-hidden="true"><g class="al-sol__rayos" stroke="#F59E0B" stroke-width="5" stroke-linecap="round">' +
    '<path d="M40 4 V14 M40 66 V76 M4 40 H14 M66 40 H76 M14.5 14.5 L21.6 21.6 M58.4 58.4 L65.5 65.5 M14.5 65.5 L21.6 58.4 M58.4 21.6 L65.5 14.5"/></g>' +
    '<circle cx="40" cy="40" r="20" fill="#FDE047" stroke="' + K + '" stroke-width="3"/><circle cx="33" cy="38" r="2.5" fill="' + K + '"/><circle cx="47" cy="38" r="2.5" fill="' + K + '"/><path d="M33 46 Q40 51 47 46" fill="none" stroke="' + K + '" stroke-width="2.4" stroke-linecap="round"/></svg>';
  function colinas(c1, c2) {
    return '<svg class="al-lejos" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M0 50 C60 10 110 20 170 44 C230 14 300 6 400 40 V80 H0 Z" fill="' + c1 + '" stroke="' + K + '" stroke-width="2.5" vector-effect="non-scaling-stroke"/>' +
      '<path d="M0 66 C80 40 150 48 220 62 C290 42 350 46 400 58 V80 H0 Z" fill="' + c2 + '" stroke="' + K + '" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>';
  }
  function ciudad(c) {
    var s = '', x = 0, alturas = [44, 62, 36, 70, 50, 30, 58, 40, 66, 46];
    alturas.forEach(function (h, i) { var w = 40; s += '<rect x="' + x + '" y="' + (80 - h) + '" width="' + w + '" height="' + h + '" fill="' + (i % 2 ? c : mezcla(c, '#FFFFFF', 0.25)) + '" stroke="' + K + '" stroke-width="2.5" vector-effect="non-scaling-stroke"/>'; x += w; });
    return '<svg class="al-lejos al-lejos--ciudad" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">' + s + '</svg>';
  }
  function decor(tipo, lado) {
    var s = '';
    if (tipo === 'farol') s = '<svg class="al-decor al-decor--' + lado + '" viewBox="0 0 30 120" aria-hidden="true"><rect x="12" y="30" width="6" height="90" fill="#374151" stroke="' + K + '" stroke-width="2"/><path d="M6 30 L24 30 L20 14 L10 14 Z" fill="#FDE047" stroke="' + K + '" stroke-width="2.4" stroke-linejoin="round"/><rect x="8" y="8" width="14" height="6" rx="2" fill="#374151" stroke="' + K + '" stroke-width="2"/></svg>';
    else if (tipo === 'arbolito') s = '<svg class="al-decor al-decor--' + lado + '" viewBox="0 0 60 120" aria-hidden="true"><rect x="26" y="70" width="8" height="50" fill="#92400E" stroke="' + K + '" stroke-width="2.4"/><circle cx="30" cy="50" r="26" fill="#22C55E" stroke="' + K + '" stroke-width="3"/><circle cx="22" cy="44" r="5" fill="#86EFAC"/></svg>';
    else if (tipo === 'juncos') s = '<svg class="al-decor al-decor--' + lado + '" viewBox="0 0 60 120" aria-hidden="true"><path d="M14 120 L12 50 M30 120 L32 30 M46 120 L50 56" stroke="#15803D" stroke-width="4" stroke-linecap="round"/><ellipse cx="12" cy="46" rx="4" ry="11" fill="#92400E" stroke="' + K + '" stroke-width="2"/><ellipse cx="32" cy="26" rx="4" ry="11" fill="#92400E" stroke="' + K + '" stroke-width="2"/></svg>';
    else if (tipo === 'fuente') s = '<svg class="al-decor al-decor--centro" viewBox="0 0 120 80" aria-hidden="true"><path class="al-chorro" d="M60 40 Q50 10 34 30 M60 40 Q70 10 86 30 M60 40 V12" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/><ellipse cx="60" cy="60" rx="50" ry="14" fill="#93C5FD" stroke="' + K + '" stroke-width="3"/><path d="M10 60 V68 A50 14 0 0 0 110 68 V60" fill="#D6D3D1" stroke="' + K + '" stroke-width="3"/></svg>';
    else if (tipo === 'granero') s = '<svg class="al-decor al-decor--' + lado + ' al-decor--granero" viewBox="0 0 90 90" aria-hidden="true"><rect x="10" y="38" width="70" height="52" fill="#DC2626" stroke="' + K + '" stroke-width="3"/><polygon points="4,42 45,8 86,42" fill="#991B1B" stroke="' + K + '" stroke-width="3" stroke-linejoin="round"/><rect x="32" y="58" width="26" height="32" fill="#FFFFFF" stroke="' + K + '" stroke-width="2.4"/><path d="M32 58 L58 90 M58 58 L32 90" stroke="#DC2626" stroke-width="3"/></svg>';
    else if (tipo === 'valla') s = '<svg class="al-valla" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 H400 M0 22 H400" stroke="#92400E" stroke-width="4" vector-effect="non-scaling-stroke"/></svg>';
    return s;
  }

  var ESCENAS = {
    calle:    { cielo: ['#BAE6FD', '#F0F9FF'], lejos: colinas('#86EFAC', '#4ADE80'), suelo: 'acera', decor: decor('arbolito', 'i') + decor('farol', 'd'), base: 16 },
    estanque: { cielo: ['#BFDBFE', '#ECFEFF'], lejos: colinas('#A7F3D0', '#6EE7B7'), suelo: 'estanque', decor: decor('juncos', 'i') + decor('juncos', 'd'), base: 7 },
    plaza:    { cielo: ['#FDE68A', '#FFFBEB'], lejos: ciudad('#FDBA74'), suelo: 'plaza', decor: decor('fuente', 'c'), base: 12 },
    habitat:  { cielo: ['#BAE6FD', '#ECFDF5'], lejos: colinas('#BBF7D0', '#86EFAC'), suelo: 'prado', decor: '', base: 9 },
    barrio:   { cielo: ['#C7D2FE', '#EEF2FF'], lejos: ciudad('#A5B4FC'), suelo: 'acera', decor: decor('farol', 'i') + decor('arbolito', 'd'), base: 16 },
    granja:   { cielo: ['#BAE6FD', '#FEFCE8'], lejos: colinas('#D9F99D', '#BEF264'), suelo: 'campo', decor: decor('granero', 'i') + decor('valla', 'c'), base: 9 }
  };
  A.escenas = Object.keys(ESCENAS);

  /* Devuelve { nodo, lugares, cielo } con las capas armadas; los lugares se agregan a `lugares`. */
  A.escena = function (tipo) {
    var e = ESCENAS[tipo] || ESCENAS.calle;
    var n = el('div', 'al-escena al-escena--' + tipo);
    n.setAttribute('data-escena', tipo);
    n.style.setProperty('--cielo-1', e.cielo[0]); n.style.setProperty('--cielo-2', e.cielo[1]); n.style.setProperty('--base', e.base + '%');
    n.innerHTML = '<div class="al-fondo" aria-hidden="true">' + SOL + nube('al-nube--1') + nube('al-nube--2') + nube('al-nube--3') +
      e.lejos + '<div class="al-suelo al-suelo--' + e.suelo + '"></div>' + e.decor + '</div>';
    var cielo = el('div', 'al-cielo');
    var lugares = el('div', 'al-lugares');
    n.appendChild(cielo); n.appendChild(lugares);
    return { nodo: n, cielo: cielo, lugares: lugares };
  };

  /* ============================================================
     GLOBO con el dibujo grande y la palabra
     ============================================================ */
  var COLORES_GLOBO = ['#EF4444', '#F59E0B', '#10B981', '#8B5CF6', '#EC4899', '#0EA5E9'];
  A.globo = function (op) {
    var color = op.color || COLORES_GLOBO[(op.indice || 0) % COLORES_GLOBO.length];
    var b = el('button', 'al-globo');
    b.type = 'button';
    var plano = op.palabra.replace(/\*/g, ''), largo = Math.max.apply(null, plano.split(' ').map(function (w) { return w.length; }));
    var L = plano.indexOf(' ') >= 0 ? Math.max(largo, Math.ceil(plano.length / 2)) : plano.length;
    b.style.setProperty('--pal', (100 / Math.max(L, 4)).toFixed(2));
    b.setAttribute('aria-label', op.etiqueta || plano);
    b.innerHTML = '<svg class="al-globo__bola" viewBox="0 0 60 92" aria-hidden="true">' +
      '<path d="M30 58 C30 70 22 76 30 92" fill="none" stroke="' + K + '" stroke-width="2"/>' +
      '<ellipse cx="30" cy="28" rx="24" ry="27" fill="' + color + '" stroke="' + K + '" stroke-width="3"/>' +
      '<path d="M26 55 L34 55 L30 61 Z" fill="' + color + '" stroke="' + K + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<ellipse cx="21" cy="17" rx="5" ry="8" transform="rotate(25 21 17)" fill="#FFFFFF" opacity=".55"/></svg>' +
      '<span class="al-carta"><span class="al-carta__dibujo">' + A.icono(op.icono, 'al-ico al-ico--grande') + '</span>' +
      '<span class="al-carta__palabra" lang="en">' + marcas(op.palabra) + '</span></span>';
    return b;
  };

  /* ============================================================
     ESTRELLAS de la etapa
     ============================================================ */
  function estrella(llena) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 L15.1 8.2 L22.4 9 L17 14 L18.5 21.3 L12 17.6 L5.5 21.3 L7 14 L1.6 9 L8.9 8.2 Z" fill="' +
      (llena ? '#FBBF24' : '#FFFFFF') + '" stroke="' + K + '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  }
  /* Mano que muestra el arrastre en la demostracion de Pip. */
  A.mano = function () {
    var m = el('span', 'al-mano');
    m.setAttribute('aria-hidden', 'true');
    m.innerHTML = '<svg viewBox="0 0 40 48"><path d="M14 22 V6 a4 4 0 0 1 8 0 V20 l2-1 a4 4 0 0 1 5 3 l1-.5 a4 4 0 0 1 5 3 V34 c0 7-5 12-12 12 h-2 c-5 0-8-2-11-6 L4 32 a3.6 3.6 0 0 1 5-5 l5 5 Z" fill="#FFFFFF" stroke="' + K + '" stroke-width="3" stroke-linejoin="round"/></svg>';
    return m;
  };
  A.estrellas = function (n) {
    var c = el('div', 'al-estrellas');
    c.setAttribute('role', 'img');
    for (var i = 0; i < n; i++) { var s = el('span', 'al-estrella', estrella(false)); c.appendChild(s); }
    c._n = 0;
    c.setAttribute('aria-label', '0 / ' + n);
    return c;
  };
  A.llenarEstrella = function (c) {
    var s = c.children[c._n]; if (!s) return;
    s.innerHTML = estrella(true); s.classList.add('al-estrella--llena');
    c._n++; c.setAttribute('aria-label', c._n + ' / ' + c.children.length);
  };

  /* ============================================================
     ANIMACIONES
     ============================================================ */
  function reiniciarClase(n, cls) { n.classList.remove(cls); void n.getBoundingClientRect(); n.classList.add(cls); }
  function centro(n) { var r = n.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r }; }

  A.temblar = function (lugar) { reiniciarClase(lugar, 'al-tiembla'); setTimeout(function () { lugar.classList.remove('al-tiembla'); }, 620); };
  A.brillar = function (lugar) { reiniciarClase(lugar, 'al-brilla'); setTimeout(function () { lugar.classList.remove('al-brilla'); }, 2600); };
  A.celebrar = function (pip) { if (pip) { reiniciarClase(pip, 'al-pip--fiesta'); setTimeout(function () { pip.classList.remove('al-pip--fiesta'); }, 1000); } };

  A.confeti = function (x, y, n) {
    if (MENOS_MOV) n = Math.min(n || 18, 8);
    var colores = ['#EF4444', '#F59E0B', '#FDE047', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899'];
    for (var i = 0; i < (n || 18); i++) {
      var p = el('span', 'al-confeti');
      var ang = (-90 + (Math.random() - 0.5) * 150) * Math.PI / 180, dist = 70 + Math.random() * 110;
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.background = colores[i % colores.length];
      p.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      p.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      p.style.setProperty('--giro', ((Math.random() - 0.5) * 720).toFixed(0) + 'deg');
      if (i % 3 === 0) p.style.borderRadius = '50%';
      document.body.appendChild(p);
      setTimeout(function (q) { return function () { q.remove(); }; }(p), 1300);
    }
  };

  /* Pip y el globo llegan volando desde un costado */
  A.entrar = function (nodo) { reiniciarClase(nodo, 'al-entra'); setTimeout(function () { nodo.classList.remove('al-entra'); }, 900); };

  /* El globo vuela a la puerta del lugar y se encoge; luego se quita. */
  /* op.lento (demostracion): viaja despacio a tamaño casi normal, como arrastrado, y se encoge al llegar */
  A.volar = function (globo, lugar, alLlegar, op) {
    var g = centro(globo), d = centro(lugar.querySelector('.al-puerta') || lugar);
    var dx = d.x - g.x, dy = d.y - g.y, base = globo.style.transform || '';
    globo.style.animation = 'none';
    void globo.offsetWidth;   /* reflujo: sin esto el navegador no anima el viaje y el globo salta */
    if (op && op.lento && !MENOS_MOV) {
      globo.style.transition = 'transform 1.25s cubic-bezier(.45,.05,.55,.95)';
      globo.style.transform = base + ' translate(' + dx + 'px,' + (dy - g.r.height * 0.25) + 'px) scale(.75)';
      setTimeout(function () {
        globo.style.transition = 'transform .28s ease-in, opacity .28s';
        globo.style.transform = base + ' translate(' + dx + 'px,' + dy + 'px) scale(.2)'; globo.style.opacity = '0';
      }, 1250);
      setTimeout(function () { alLlegar && alLlegar(); }, 1530);
      return;
    }
    globo.style.transition = MENOS_MOV ? 'opacity .2s' : 'transform .42s cubic-bezier(.4,.1,.6,1), opacity .42s';
    globo.style.transform = base + ' translate(' + dx + 'px,' + dy + 'px) scale(.2)';
    globo.style.opacity = '0';
    setTimeout(function () { alLlegar && alLlegar(); }, MENOS_MOV ? 200 : 420);
  };

  /* Acierto: se abre la puerta, se asoma el vecino, el dibujo sube con confeti
     y queda en la ventana. La puerta se cierra sola. */
  A.abrir = function (lugar, icono, alTerminar) {
    reiniciarClase(lugar, 'al-abierta');
    var p = centro(lugar.querySelector('.al-puerta') || lugar);
    var sube = el('span', 'al-sube', A.icono(icono, 'al-ico'));
    sube.style.left = p.x + 'px'; sube.style.top = p.y + 'px';
    document.body.appendChild(sube);
    A.confeti(p.x, p.r.top, 22);
    var v = lugar.querySelector('.al-ventana');
    setTimeout(function () {
      sube.remove();
      if (v) {
        var x = +v.getAttribute('data-x'), y = +v.getAttribute('data-y'), l = +v.getAttribute('data-l');
        v.innerHTML = '<g class="al-ventana__pon">' + anidar(icono, x, y, l) + '</g>';
      }
    }, MENOS_MOV ? 500 : 1050);
    setTimeout(function () { lugar.classList.remove('al-abierta'); alTerminar && alTerminar(); }, MENOS_MOV ? 700 : 1500);
  };

  /* ============================================================
     ARRASTRE con el dedo o el raton, y toque
     op = { alSoltar(lugarNodo), alTocar(), selector }
     ============================================================ */
  A.arrastre = function (nodo, op) {
    var sel = op.selector || '[data-lugar]', ini = null, sobre = null, movido = false;
    function lugarEn(x, y) {
      nodo.style.visibility = 'hidden';
      var d = document.elementFromPoint(x, y);
      nodo.style.visibility = '';
      return d && d.closest ? d.closest(sel) : null;
    }
    function marcar(l) { if (sobre === l) return; if (sobre) sobre.classList.remove('al-sobre'); sobre = l; if (sobre) sobre.classList.add('al-sobre'); }
    nodo.addEventListener('pointerdown', function (e) {
      if (e.button > 0 || nodo.disabled) return;
      ini = { x: e.clientX, y: e.clientY, id: e.pointerId }; movido = false;
      try { nodo.setPointerCapture(e.pointerId); } catch (er) { /* nada */ }
    });
    nodo.addEventListener('pointermove', function (e) {
      if (!ini || e.pointerId !== ini.id) return;
      var dx = e.clientX - ini.x, dy = e.clientY - ini.y;
      if (!movido && Math.abs(dx) + Math.abs(dy) < 8) return;
      if (!movido) {
        movido = true;
        /* se encoge alrededor del dedo para que se vean los lugares */
        Array.prototype.forEach.call(nodo.children, function (h) { var r = h.getBoundingClientRect(); h.style.transformOrigin = (ini.x - r.left) + 'px ' + (ini.y - r.top) + 'px'; });
        nodo.classList.add('al-arrastrando');
      }
      nodo.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      nodo.style.setProperty('--inclina', Math.max(-12, Math.min(12, dx / 14)).toFixed(1) + 'deg');
      marcar(lugarEn(e.clientX, e.clientY));
      e.preventDefault();
    });
    function fin(e, vale) {
      if (!ini || e.pointerId !== ini.id) return;
      var l = vale && movido ? lugarEn(e.clientX, e.clientY) : null, eraMov = movido;
      ini = null; marcar(null); nodo.classList.remove('al-arrastrando');
      /* el origen puesto en el dedo se quita: si no, en horizontal el globo (rotado) queda corrido de la carta */
      Array.prototype.forEach.call(nodo.children, function (h) { h.style.transformOrigin = ''; });
      if (eraMov) {
        nodo._sinClick = true; setTimeout(function () { nodo._sinClick = false; }, 60);
        if (l) { op.alSoltar && op.alSoltar(l); }
        else { nodo.style.transition = 'transform .25s ease'; nodo.style.transform = ''; setTimeout(function () { nodo.style.transition = ''; }, 260); }
      }
    }
    nodo.addEventListener('pointerup', function (e) { fin(e, true); });
    nodo.addEventListener('pointercancel', function (e) { fin(e, false); });
    nodo.addEventListener('click', function (e) { if (nodo._sinClick) { e.preventDefault(); return; } op.alTocar && op.alTocar(); });
  };

    function parar() { if (timer) clearInterval(timer); timer = null; sonando = false; try { if (mudo) mudo.pause(); } catch (e) { /* nada */ } }
    var bajo = false;
    function bajar(si) { bajo = si; try { if (master) master.gain.setTargetAtTime(si ? VOL_BAJO : VOL, ac.currentTime, 0.12); } catch (e) { /* nada */ } }
    /* Prueba: renderiza la partitura sin sonar y mide energia total y audible en telefono. */
    function medir(estilo, segundos) {
      var sr = 44100, c = new OfflineAudioContext(1, sr * segundos, sr), g = c.createGain();
      g.gain.value = VOL; g.connect(c.destination);
      var e = ESTILOS[estilo], dt = 60 / e.bpm / 2, tt = 0.05, pp = 0;
      while (tt < segundos - 0.3) { e.tocar(c, g, tt, pp, e.acordes[Math.floor(pp / 8) % e.acordes.length], dt); tt += dt; pp++; }
      /* filtro paso alto a 300 Hz en paralelo: lo que un parlante de telefono reproduce */
      return c.startRendering().then(function (buf) {
        var x = buf.getChannelData(0), n = x.length, tot = 0, alto = 0, y = 0, prev = 0, a = 1 / (1 + 2 * Math.PI * 300 / sr);

  })();

  /* ---------- voz del telefono (sin enviar nada fuera) ---------- */
  function cargarVoces() { try { voces = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { voces = []; } }
  var LATAM = ['es-us', 'es-419', 'es-mx', 'es-co'];
  function mejorVoz(idioma) {
    var lang = (idioma || cfg.lang).toLowerCase(), base = lang.slice(0, 2), mejor = null, top = -1;
    voces.forEach(function (v) {
      var l = (v.lang || '').replace('_', '-').toLowerCase();
      /* Regla 2 del repo: solo voces del propio telefono (localService), nada por red. */
      if (l.slice(0, 2) !== base || v.localService !== true) return;
      /* en español Pip prefiere acento latinoamericano si el telefono lo tiene (es-US, es-419, es-MX, es-CO)
         antes que es-ES; si no hay ninguno, cualquier voz es- local */
      var p = (base === 'es' && LATAM.indexOf(l) >= 0 ? 10 : 0) + (l === lang ? 4 : 0) + (/natural|premium|enhanced|neural|siri/i.test(v.name) ? 5 : 0);
      if (p > top) { top = p; mejor = v; }

  }
  /* op (opcional, modo aldea): { lento: palabra despacio como pista, cola: no corta lo que se esta diciendo } */
  function hablar(texto, op) {
    if (!vozOn || !window.speechSynthesis || !texto) return;
    op = op || {};
    try {
      if (!op.cola) speechSynthesis.cancel();
      var limpio = plano(texto).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/_+/g, ' ').trim();
      if (!limpio) return;
      if (!voces.length) cargarVoces();
      var v = mejorVoz(op.lang);
      if (!v) { if (op.alTerminar) op.alTerminar(); return; }   /* sin voz local no habla: queda el texto (regla 2) */
      var u = new SpeechSynthesisUtterance(limpio);
      u.voice = v; u.lang = v.lang;
      u.rate = op.lento ? 0.55 : (op.lang && op.lang !== cfg.lang ? 0.95 : (cfg.velocidad || 0.9));
      u.onstart = function () { Musica.bajar(true); };
      u.onend = u.onerror = function () { Musica.bajar(false); if (op.alTerminar) op.alTerminar(); };

  }
  G.hablar = function (s) { hablar(s); };

  /* ---------- progreso (solo que se termino) ---------- */
  function clave() { return 'samsan:guia-' + cfg.id; }
  function cargar() { try { hechas = JSON.parse(localStorage.getItem(clave()) || '{}') || {}; } catch (e) { hechas = {}; } }
  function guardar() { try { localStorage.setItem(clave(), JSON.stringify(hechas)); } catch (e) { /* sin almacenamiento */ } }
  function idAct(mi, ai) { return cfg.misiones[mi].id + '-' + (ai + 1); }
  function nHechas(mi) { return cfg.misiones[mi].actividades.filter(function (a, ai) { return hechas[idAct(mi, ai)]; }).length; }
  function completa(mi) { return nHechas(mi) === cfg.misiones[mi].actividades.length; }
  function siguienteMision() {
    for (var i = 0; i < cfg.misiones.length; i++) if (!completa(i)) return i;
    return -1;
  }
  /* XP: 50 por actividad terminada (no por aciertos). */
  var XP_ACT = 50;
  function xpTotal() {
    var n = 0;
    cfg.misiones.forEach(function (m, mi) { n += nHechas(mi); });
    return n * XP_ACT;
  }
  function nivel(xp) {
    var ns = cfg.xp.niveles, i = 0;
    while (i + 1 < ns.length && xp >= ns[i + 1][0]) i++;

  }

  /* ---------- variedad: banco, muestra y variantes ---------- */
  function preparar(a0, chica) {
    var a = copiar(a0);
    if (a.variantes) {
      var v = a.variantes[Math.floor(Math.random() * a.variantes.length)];
      Object.keys(v).forEach(function (k) { a[k] = v[k]; });
    }
    var n = chica ? (a.muestraJefe || Math.min(a.muestra || 99, 4)) : a.muestra;
    if (a.tipo === 'clasificar') {
      var porCaja = n ? Math.max(1, Math.floor(n / a.cajas.length)) : 99, elegidos = [];
      a.cajas.forEach(function (c) { elegidos = elegidos.concat(mezclar(a.items.filter(function (x) { return x.caja === c.id; })).slice(0, porCaja)); });
      a.items = elegidos;
    }
    else if (a.tipo === 'emparejar' && n) a.pares = mezclar(a.pares).slice(0, n);
    else if (a.tipo === 'tocar') a.frases = mezclar(a.frases).slice(0, n || a.frases.length);

  function barra(titulo, sub, alVolver) {

  function pasos(mi, p) {

  /* ---------- efectos: vuelo de la ficha y chispas ---------- */
  function centro(n) { var r = n.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r }; }
  function volar(desde, hasta) {
    if (MENOS_MOV || !desde || !hasta) return;
    try {
      var a = centro(desde), b = centro(hasta);
      if (!a.r.width) return;
      var c = desde.cloneNode(true);
      c.classList.add('g-vuelo'); c.removeAttribute('id');
      c.style.left = a.r.left + 'px'; c.style.top = a.r.top + 'px'; c.style.width = a.r.width + 'px';
      document.body.appendChild(c);
      requestAnimationFrame(function () {
        c.style.transform = 'translate(' + (b.x - a.x) + 'px,' + (b.y - a.y) + 'px) scale(.55)'; c.style.opacity = '0.2';
      });
      setTimeout(function () { c.remove(); }, 420);
    } catch (e) { /* nada */ }
  }
  function chispas(n) {
    if (MENOS_MOV || !n) return;
    try {
      var p = centro(n); if (!p.r.width) return;
      for (var i = 0; i < 10; i++) {
        var ang = (i / 10) * Math.PI * 2, d = 26 + Math.random() * 22;
        var s = el('span', { class: 'g-chispa', 'aria-hidden': 'true' });
        s.style.left = p.x + 'px'; s.style.top = p.y + 'px';
        s.style.setProperty('--dx', Math.cos(ang) * d + 'px'); s.style.setProperty('--dy', Math.sin(ang) * d + 'px');
        document.body.appendChild(s);
        setTimeout(function (x) { return function () { x.remove(); }; }(s), 650);
      }
    } catch (e) { /* nada */ }
  }

  /* ---------- arrastrar y soltar (ademas de tocar) ---------- */
  function arrastrable(f, alSoltar) {
    var ini = null, fant = null, movio = false, sobre = null;
    f.classList.add('g-arrastra');
    f.addEventListener('click', function (e) { if (f._sinClick) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
    function destinoEn(x, y) {
      var bajo = document.elementFromPoint && document.elementFromPoint(x, y);
      return bajo && bajo.closest ? bajo.closest('[data-destino]') : null;
    }
    /* el movimiento se sigue en la ventana: el dedo sale de la ficha enseguida */
    function mover(e) {
      if (!ini || e.pointerId !== ini.id) return;
      if (!movio && Math.abs(e.clientX - ini.x) + Math.abs(e.clientY - ini.y) < 12) return;
      if (!movio) {
        movio = true;
        var r = f.getBoundingClientRect();
        fant = f.cloneNode(true); fant.classList.add('g-fantasma'); fant.removeAttribute('id');
        fant.style.width = r.width + 'px'; fant._dx = ini.x - r.left; fant._dy = ini.y - r.top;
        document.body.appendChild(fant); f.classList.add('g-origen');
      }
      if (e.cancelable) e.preventDefault();
      fant.style.left = (e.clientX - fant._dx) + 'px'; fant.style.top = (e.clientY - fant._dy) + 'px';
      var d = destinoEn(e.clientX, e.clientY);
      if (d !== sobre) { if (sobre) sobre.classList.remove('g-sobre'); sobre = d; if (sobre) sobre.classList.add('g-sobre'); }
    }
    function soltarAqui(e) { if (ini && e.pointerId === ini.id) fin(e, true); }
    function cancelar(e) { if (ini && e.pointerId === ini.id) fin(e, false); }
    function quitar() {
      window.removeEventListener('pointermove', mover);
      window.removeEventListener('pointerup', soltarAqui);
      window.removeEventListener('pointercancel', cancelar);
    }
    f.addEventListener('pointerdown', function (e) {
      if (f.disabled || (e.button && e.button > 0)) return;
      ini = { x: e.clientX, y: e.clientY, id: e.pointerId }; movio = false;
      window.addEventListener('pointermove', mover, { passive: false });
      window.addEventListener('pointerup', soltarAqui);
      window.addEventListener('pointercancel', cancelar);
    });
    function fin(e, soltar) {
      quitar();
      if (!ini) return;
      var era = movio; ini = null; movio = false;
      if (!era) return;
      if (fant) fant.remove(); fant = null; f.classList.remove('g-origen');
      if (sobre) sobre.classList.remove('g-sobre'); sobre = null;
      f._sinClick = true; setTimeout(function () { f._sinClick = false; }, 60);
      var d = soltar ? destinoEn(e.clientX, e.clientY) : null;
      if (d) alSoltar(d);
    }
  }

  /* ---------- actividad: marco comun ---------- */
  function actividad(s, mi, ai) {
    var m = cfg.misiones[mi], a = preparar(m.actividades[ai], !!m.jefe);
    racha = 0;
    var orden = el('div', { class: 'g-orden' });
    orden.appendChild(el('p', { html: marcas(a.orden) }));
    orden.appendChild(el('button', { class: 'g-icono', 'aria-label': t('escucha'), html: ICO.voz, onclick: function () { hablar(a.orden); } }));
    s.appendChild(orden);
    if (a.lectura) {
      var lec = el('div', { class: 'g-tarjeta g-lectura' });
      if (a.lectura.h) lec.appendChild(el('h3', { text: a.lectura.h }));
      [].concat(a.lectura.p).forEach(function (par) {
        var bt = el('button', { class: 'g-frase-ej', html: marcas(par) });
        bt.addEventListener('click', function () { hablar(par); });
        lec.appendChild(bt);
      });
      s.appendChild(lec);
    }
    var zona = el('div', { class: 'g-zona' });
    s.appendChild(zona);
    var pista = el('p', { class: 'g-pista', role: 'status' });
    var peldano = 0;

        bloque.split(/\b(Who|What|Where|When|Why|because)\b/).forEach(function (x) {
          if (!x || !/[A-Za-zÁÉÍÓÚáéíóúñ]/.test(x)) return;
          r.push({ t: x.trim(), lang: INGLES.test(x) && x.length < 9 ? cfg.lang : (cfg.langExplica || 'es-ES') });
        });
      });
      return r;
    }
    function palabrasWh(html) {
      return html.replace(/\b(Who|What|Where|When|Why|because)\b/g, function (w) {
        var z = { Who: 'who', What: 'what', Where: 'where', When: 'when', Why: 'why', because: 'why' }[w];
        return '<b class="le-palabra" style="--c:' + C(z).color + '" lang="en">' + w + '</b>';
      });
    }
    function lineaHtml(linea) {
      if (linea.es) return '<span class="le-es" lang="es">' + linea.es.split(/«([^»]+)»/).map(function (bloque, j) {
        return j % 2 === 1 ? '<b class="le-cita" lang="en">' + palabrasWh(esc(bloque)) + '</b>' : palabrasWh(marcas(bloque));
      }).join('') + '</span>';
      return '<span class="le-en" lang="en">' + esc(linea.en) + '</span>';
    }

    function pintar(x) {
      token++;
      raiz.classList.toggle('g-raiz--aldea', x.l !== undefined);
      document.body.classList.toggle('al-jugando', x.l !== undefined);
      if (x.l !== undefined) leccion(x.l); else portada();
    }

    /* ---------- portada: Pip, codigo de las preguntas, lecciones y calcomanias ---------- */
    function portada() {
      var A = K();
      var s = el('section', { class: 'g-portada al-portada le-portada' });
      s.appendChild(barra(cfg.titulo, cfg.subtitulo));
      var hola = el('div', { class: 'al-hola' });

      pc.addEventListener('click', function () { hablar(saludo, { lang: cfg.langExplica }); A.celebrar(pc.querySelector('.al-pip')); });
      hola.appendChild(pc);
      hola.appendChild(el('p', { class: 'al-globo-texto g-globo', text: saludo }));
      s.appendChild(hola);
      var sig = 0; while (sig < cfg.lecciones.length - 1 && st.hechas[cfg.lecciones[sig].id]) sig++;
      var play = el('button', { id: 'play', class: 'g-btn g-btn--grande', html: '▶ ' + esc(Object.keys(st.hechas).length ? 'Seguir' : 'Empezar') + ' · ' + esc(cfg.lecciones[sig].titulo) });
      play.addEventListener('click', function () { ir({ l: sig }); });
      s.appendChild(play);
      cfg.unidades.forEach(function (u) {
        s.appendChild(el('h2', { class: 'g-seccion', html: esc(u.titulo) + ' <small>' + esc(u.es) + '</small>' }));
        /* el codigo fijo, siempre a la vista */
        var cod = el('div', { class: 'le-codigo' });
        Object.keys(cfg.codigo).forEach(function (z) { cod.appendChild(tarjetaCodigo(z, true)); });
        s.appendChild(cod);
        var ol = el('ol', { class: 'le-lecciones' });
        cfg.lecciones.forEach(function (L, li) {
          if (L.unidad !== u.id) return;
          var hecha = !!st.hechas[L.id];
          var b = el('button', { class: 'le-leccion' + (hecha ? ' le-leccion--hecha' : '') + (li === sig && !hecha ? ' le-leccion--aqui' : ''),
            html: '<span class="le-leccion__n">' + (li + 1) + '</span><span class="le-leccion__t">' + esc(L.titulo) + '<small lang="en">' + esc(L.en) + '</small></span>' +
              '<span class="le-leccion__calco">' + (hecha ? A.icono(IC(L.calco), 'al-ico') : '▶') + '</span>' });
          b.addEventListener('click', function () { ir({ l: li }); });
          ol.appendChild(el('li', null, [b]));
        });
        s.appendChild(ol);
      });
      raiz.appendChild(s);
    }
    function tarjetaCodigo(z, chica) {
      var c = C(z), A = K();
      var b = el('button', { class: 'le-cod' + (chica ? ' le-cod--chica' : ''), 'aria-label': c.t + ', ' + c.es, html:
        '<span class="le-cod__ico">' + A.icono(IC(c.ico), 'al-ico') + '</span><b lang="en">' + esc(c.t) + '?</b><span lang="es">' + esc(c.es) + '</span>' + (chica ? '' : '<small>' + esc(c.pide) + '</small>') });
      b.style.setProperty('--c', c.color);
      b.addEventListener('click', function () { hablar(c.t, { lang: cfg.lang }); hablar(c.es, { lang: cfg.langExplica, cola: true }); partir(c.regla).forEach(function (tr) { hablar(tr.t, { lang: tr.lang, cola: true }); }); });
      return b;
    }

    /* ---------- una leccion: los 5 pasos en la misma pantalla ---------- */
    function leccion(li) {
      var A = K(), L = cfg.lecciones[li], mio = token;
      if (L.mecanica === 'cuento') { leccionCuento(li); return; }
      if (L.mecanica === 'fichas') { leccionFichas(li); return; }
      var p = el('section', { class: 'al-pantalla le-pantalla' });
      var bar = el('div', { class: 'al-barra' });
      bar.appendChild(el('button', { class: 'g-icono', 'aria-label': t('atras'), html: ICO.atras, onclick: function () { ir({}); } }));
      var pasosBar = el('ol', { class: 'le-pasos', 'aria-label': 'Pasos' });
      PASOS.forEach(function (k, i) { pasosBar.appendChild(el('li', { class: 'le-paso', 'data-paso': k, html: '<span>' + (i + 1) + '</span><small>' + NOMBRE_PASO[k] + '</small>' })); });
      bar.appendChild(pasosBar);
      var bAyuda = el('button', { class: 'g-icono al-bombilla', 'aria-label': t('ayuda'), html: ICO.bombilla });
      bar.appendChild(bAyuda);
      p.appendChild(bar);
      var esc2 = A.escena(L.escena || 'calle'); esc2.nodo.setAttribute('data-n', String(L.zonas.length));
      var porZona = {}, PAR = L.mecanica === 'parejas';
      if (PAR) esc2.nodo.setAttribute('data-mec', 'parejas');
      if (!PAR) L.zonas.forEach(function (z) {
        var c = C(z);
        var l = A.lugar({ id: z, tipo: 'casa', color: c.color, letrero: c.t + '?', ejemplo: IC(c.ico), etiqueta: c.t + ', ' + c.es });
        l.insertBefore(el('span', { class: 'le-traduccion', lang: 'es', 'aria-hidden': 'true', text: c.es, style: '--c:' + c.color }), l.querySelector('.al-dibujo-lugar'));
        l.addEventListener('click', function (ev) {
          if (ev.target && ev.target.closest && ev.target.closest('.al-letrero, .le-traduccion')) { hablar(c.t, { lang: cfg.lang }); hablar(c.es, { lang: cfg.langExplica, cola: true }); partir(c.regla).forEach(function (tr) { hablar(tr.t, { lang: tr.lang, cola: true }); }); return; }
          soltar(z);
        });
        porZona[z] = l;
        esc2.lugares.appendChild(l);
      });
      var vuelo = el('div', { class: 'al-vuelo' });
      var pipCaja = el('div', { class: 'al-pip-caja', html: vestir(A.pip('Pip'), null) });
      vuelo.appendChild(pipCaja);
      esc2.cielo.appendChild(vuelo);
      p.appendChild(esc2.nodo);
      var dialogo = el('div', { class: 'le-dialogo', role: 'status', 'aria-live': 'polite' });
      var texto = el('p', { class: 'le-dialogo__texto' });
      var acciones = el('div', { class: 'le-dialogo__acciones' });
      var bOtra = el('button', { class: 'g-icono', 'aria-label': 'Otra vez', html: ICO.otra });
      var bSeguir = el('button', { class: 'g-btn le-seguir', html: 'Seguir ▶', disabled: 'disabled' });
      acciones.appendChild(bOtra); acciones.appendChild(bSeguir);
      dialogo.appendChild(texto); dialogo.appendChild(acciones);
      p.appendChild(dialogo);
      raiz.appendChild(p);

      var salieron = [];   /* solo pruebas: que ejemplos salieron y en que orden */
      var paso = null, globo = null, activo = null, cola = [], ultima = null, alSeguir = null, ayudado = false, ocupado = false;
      function vivo() { return mio === token && p.isConnected; }
      function despues(f, ms) { setTimeout(function () { if (vivo()) f(); }, espera(ms)); }
      function marcarPaso(k) {
        paso = k;
        Array.prototype.forEach.call(pasosBar.children, function (n) {
          var i = PASOS.indexOf(n.getAttribute('data-paso')), j = PASOS.indexOf(k);
          n.classList.toggle('le-paso--ahora', i === j); n.classList.toggle('le-paso--hecho', i < j);
        });
        p.setAttribute('data-paso', k);
        bAyuda.hidden = !(k === 'juntos' || k === 'tu');
      }
      function mostrar(lineas) { texto.innerHTML = lineas.map(lineaHtml).join(' '); }
      /* dice varias lineas seguidas mostrando cada una; alFin al terminar */
      var cadena = 0, pendiente = null;
      function guion(lineas, alFin) {
        ultima = lineas; pendiente = alFin || null;
        var i = 0, esta = ++cadena;   /* un guion nuevo deja callado al anterior */
        (function uno() {
          if (!vivo() || esta !== cadena) return;
          if (i >= lineas.length) { pendiente = null; if (alFin) alFin(); return; }
          var ln = lineas[i++];
          mostrar([ln]);
          if (ln.zona) { A.brillar(porZona[ln.zona]); }
          if (ln.ico) mostrarCarta(ln.ico, ln.en || '');
          decir(ln, uno);
        })();
      }
      function esperarSeguir(f) { bSeguir.disabled = false; bSeguir.classList.add('le-seguir--late'); alSeguir = f; despues(function () { try { bSeguir.focus({ preventScroll: true }); } catch (e) { /* nada */ } }, 50); }
      bSeguir.addEventListener('click', function () { if (bSeguir.disabled) return; bSeguir.disabled = true; bSeguir.classList.remove('le-seguir--late'); var f = alSeguir; alSeguir = null; if (f) f(); });
      /* «otra vez» repite lo ultimo y luego sigue donde iba, como en la mecanica
         «cuento» (antes cambiaba el token y cortaba la cadena del guion: si se
         tocaba mientras Pip hablaba, la leccion se quedaba parada) */
      bOtra.addEventListener('click', function () {
        if (!ultima) return;
        try { speechSynthesis.cancel(); } catch (e) { /* nada */ }
        guion(ultima, pendiente);
      });
      pipCaja.addEventListener('click', function () { if (activo) hablar(activo.en, { lang: cfg.lang }); });

      function volverGlobo() { var g = globo; if (!g) return; g.style.transition = 'transform .3s ease'; g.style.transform = ''; setTimeout(function () { g.style.transition = ''; }, 320); }
      /* parejas: pone las tarjetas de razon de una ronda (cambian en cada ronda) */
      function ponerRazones(lista) {
        Object.keys(porZona).forEach(function (q) { delete porZona[q]; });
        esc2.lugares.innerHTML = '';
        esc2.nodo.setAttribute('data-n', String(lista.length));
        lista.forEach(function (it) {
          var c = el('button', { type: 'button', class: 'al-lugar le-razon', 'data-lugar': it.zona, 'aria-label': it.razon, style: '--c:' + C('why').color, html:
            '<span class="al-dibujo-lugar le-razon__caja"><span class="le-razon__par" aria-hidden="true"></span>' + A.icono(IC(it.icoRazon), 'al-ico le-razon__ico') +
            '<span class="le-razon__txt" lang="en"><b>Because</b> ' + esc(it.razon.replace(/^Because\s+/, '')) + '</span></span>' });
          c.addEventListener('click', function () { if (activo && (paso === 'juntos' || paso === 'tu')) soltar(it.zona); else hablar(it.razon, { lang: cfg.lang }); });
          porZona[it.zona] = c;
          esc2.lugares.appendChild(c);
        });
      }
      function emparejar(l, it) {
        if (!PAR || !l) return;
        l.classList.add('le-razon--hecha');
        var par = l.querySelector('.le-razon__par'); if (par) par.innerHTML = A.icono(IC(it.ico), 'al-ico');
      }
      function quitarCarta() { if (globo) { globo.remove(); globo = null; } }
      function mostrarCarta(ico, palabra) {
        quitarCarta();
        globo = A.globo({ palabra: (PAR ? String(palabra || ' ').replace(/^Why\b/, '*Why*') : palabra) || ' ', icono: IC(ico), indice: Math.floor(Math.random() * 6) });
        globo.classList.add('le-globo');
        if (PAR) globo.classList.add('le-globo--why');
        vuelo.appendChild(globo); A.entrar(vuelo);
        return globo;
      }
      function frase(it) { return PAR ? it.en + ' ' + it.razon : C(it.zona).q + ' ' + it.en.charAt(0).toUpperCase() + it.en.slice(1) + '.'; }
      function por(it) { return PAR ? it.esRazon : it.nota || L.por[it.zona]; }
      function porque(it) { return por(it) + ' Va en la casa de ' + C(it.zona).t + '.'; }
      function llevar(it, alFin) {
        var g = globo, l = porZona[it.zona];
        ocupado = true;
        A.volar(g, l, function () {
          g.remove(); if (globo === g) globo = null;
          emparejar(l, it);
          A.confeti(l.getBoundingClientRect().left + l.offsetWidth / 2, l.getBoundingClientRect().top + 20, 16);
          A.celebrar(pipCaja.querySelector('.al-pip'));
          ocupado = false;
          if (alFin) alFin();
        });
      }

      /* 1 · MIRA */
      function mira() {
        marcarPaso('mira');
        if (PAR) ponerRazones(L.modelos);
        guion(L.mira, function () { quitarCarta(); esperarSeguir(yo); });
      }
      /* 2 · YO LO HAGO: Pip lleva dos ejemplos con la mano y dice por que */
      function yo() {
        marcarPaso('yo');
        if (PAR) ponerRazones(L.yo);
        var i = 0;
        guion([{ es: 'Mira cómo lo hago yo.' }], function uno() {
          if (i >= L.yo.length) { esperarSeguir(juntos); return; }
          var it = L.yo[i++];
          var g = mostrarCarta(it.ico, it.en);
          var mano = A.mano(); g.appendChild(mano);
          guion(PAR ? [{ en: it.en }, { en: it.razon, zona: it.zona }, { es: it.es + ' ' + it.esRazon }] : [{ en: frase(it) }, { es: porque(it), zona: it.zona }], function () { llevar(it, function () { despues(uno, 400); }); });
        });
      }
      /* 3 · JUNTOS y 4 · TU: el niño lleva el globo; en juntos la casa correcta brilla */
      function juntos() { if (PAR) rondas('juntos', L.juntos, tu); else ronda('juntos', L.juntos.slice(), tu); }
      function tu() { if (PAR) rondas('tu', L.tu, aprendi); else ronda('tu', mezclar(L.tu), aprendi); }
      /* parejas: varias rondas seguidas, cada una con sus tarjetas; en tu solo
         se barajan las tarjetas y el orden de las preguntas */
      function rondas(k, lista, siguiente) {
        var r = 0;
        function una(primera) {
          var R = lista[r++], mas = r < lista.length;
          ponerRazones(k === 'tu' ? mezclar(R) : R);
          ronda(k, k === 'tu' ? mezclar(R) : R.slice(), siguiente, { primera: primera, alVaciar: mas ? function () {
            guion([{ es: (L.textos && L.textos.otra) || '¡Muy bien!' }], function () { una(false); });
          } : null });
        }
        una(true);
      }
      function ronda(k, items, siguiente, op) {
        marcarPaso(k);
        cola = items; var repetidos = {};
        var intro = op && op.primera === false ? null : k === 'juntos' ? ((L.textos && L.textos.juntos) || 'Ahora lo hacemos juntos. La casa que brilla es la correcta. Lleva el globo.') : 'Ahora tú solo. ' + (L.piensa || 'Piensa bien antes de soltar.');
        if (intro) guion([{ es: intro }], sacar); else sacar();
        function sacar() {
          if (!cola.length && op && op.alVaciar) { activo = null; quitarCarta(); op.alVaciar(); return; }
          if (!cola.length) { activo = null; quitarCarta(); esperarSeguir(siguiente); guion([{ es: '¡Muy bien! Toca Seguir.' }]); return; }
          activo = cola.shift(); ayudado = false; salieron.push(k + ':' + activo.ico);
          var g = mostrarCarta(activo.ico, activo.en);
          A.arrastre(g, { alSoltar: function (l) { soltar(l.getAttribute('data-lugar')); }, alTocar: function () { if (activo) hablar(activo.en, { lang: cfg.lang }); } });
          if (k === 'juntos') guiar();
          /* la ficha se dice en ingles; tocarla la repite */
          guion([{ en: activo.en }], null);
        }
        function guiar() { var l = porZona[activo.zona]; l.classList.add('le-guia'); }
        ronda.soltar = function (z) {
          if (!activo || ocupado || paso !== k) { volverGlobo(); return; }
          var it = activo, l = porZona[z];
          Object.keys(porZona).forEach(function (q) { porZona[q].classList.remove('le-guia'); });
          if (z === it.zona) {
            sonido('ok'); racha++;
            activo = null;
            /* primero vuela a la casa y despues Pip dice la frase completa */
            llevar(it, function () { guion([{ en: frase(it) }, { es: (k === 'juntos' || ayudado ? '' : '¡Bien! ') + por(it) }], function () { despues(sacar, 300); }); });
          } else {
            sonido('mal'); racha = 0; A.temblar(l);
            volverGlobo();
            /* re-explicar con este ejemplo, no «try again» */
            ayudado = true;
            if (k === 'tu' && !repetidos[it.ico]) { repetidos[it.ico] = 1; var copia = { otra: true }; Object.keys(it).forEach(function (q) { if (q !== 'otra') copia[q] = it[q]; }); cola.push(copia); }
            guion(PAR ? [{ es: 'Mira otra vez. ' + it.es }, { en: it.razon }] : [{ es: 'Mira otra vez. ' + por(it) + ' ' + C(it.zona).regla }, { en: frase(it) }], function () { porZona[it.zona].classList.add('le-guia'); });
          }
        };
      }
      function soltar(z) { if (ronda.soltar) ronda.soltar(z); }
      bAyuda.addEventListener('click', function () {
        if (!activo) return;
        ayudado = true;
        porZona[activo.zona].classList.add('le-guia');
        guion(PAR ? [{ es: activo.es }, { en: activo.razon }] : [{ es: por(activo) + ' ' + C(activo.zona).regla }]);
      });

      /* 5 · LO QUE APRENDI */
      function aprendi() {
        marcarPaso('aprendi');
        ronda.soltar = null;
        var nueva = !st.hechas[L.id];
        st.hechas[L.id] = 1; guardar();
        sonido('fin');
        var capa = el('div', { class: 'g-capa le-resumen', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Lo que aprendí' });
        var box = el('div', { class: 'g-logro' });
        box.appendChild(el('h3', { text: 'Lo que aprendí' }));
        if (PAR) {
          /* parejas: la tarjeta de Why y tres parejas que suenan (pregunta y razon) */
          var filaP = el('div', { class: 'le-resumen__fila le-resumen__fila--par', style: '--c:' + C('why').color });
          filaP.appendChild(tarjetaCodigo('why'));
          var lista = el('div', { class: 'le-resumen__pares' });
          L.resumen.forEach(function (e) {
            var b = el('button', { class: 'le-par', 'aria-label': e.en + ' ' + e.razon, html:
              '<span class="le-par__ico">' + A.icono(IC(e.ico), 'al-ico') + '</span><span class="le-par__txt" lang="en"><b>' + esc(e.en) + '</b><span>' + esc(e.razon) + '</span></span><span class="le-par__ico">' + A.icono(IC(e.icoRazon), 'al-ico') + '</span>' });
            b.addEventListener('click', function () { hablar(e.en, { lang: cfg.lang }); hablar(e.razon, { lang: cfg.lang, cola: true }); });
            lista.appendChild(b);
          });
          filaP.appendChild(lista);
          box.appendChild(filaP);
        }
        if (!PAR) L.resumen.forEach(function (r) {
          var c = C(r.zona), fila = el('div', { class: 'le-resumen__fila', style: '--c:' + c.color });
          fila.appendChild(tarjetaCodigo(r.zona));
          var ejs = el('div', { class: 'le-resumen__ej' });
          r.ej.forEach(function (e) {
            var b = el('button', { class: 'le-resumen__btn', 'aria-label': e.en, html: A.icono(IC(e.ico), 'al-ico') + '<span lang="en">' + esc(e.en) + '</span>' });
            b.addEventListener('click', function () { hablar(c.q + ' ' + e.en.charAt(0).toUpperCase() + e.en.slice(1) + '.', { lang: cfg.lang }); });
            ejs.appendChild(b);
          });
          fila.appendChild(ejs);
          box.appendChild(fila);
        });
        box.appendChild(el('p', { class: 'le-calco', html: A.icono(IC(L.calco), 'al-ico') + '<span>' + (nueva ? '¡Calcomanía nueva!' : '¡Lección repasada!') + '</span>' }));
        var sigL = li + 1 < cfg.lecciones.length ? li + 1 : null;
        if (sigL !== null) box.appendChild(el('button', { class: 'g-btn', html: 'Siguiente lección ▶', onclick: function () { capa.remove(); ir({ l: sigL }); } }));
        box.appendChild(el('button', { class: 'g-btn g-btn--suave', html: ICO.otra + ' Repetir la lección', onclick: function () { capa.remove(); ir({ l: li }, true); } }));
        box.appendChild(el('button', { class: 'g-btn' + (sigL === null ? '' : ' g-btn--suave'), text: 'Lecciones', onclick: function () { capa.remove(); ir({}); } }));
        capa.appendChild(box); document.body.appendChild(capa);
        guion([{ es: 'Esto es lo que aprendiste hoy.' }].concat((PAR ? L.zonas.map(function (z) { return { zona: z }; }) : L.resumen).map(function (r) { return { es: C(r.zona).t + ' significa ' + C(r.zona).es.replace(/[¿?]/g, '') + '. ' + C(r.zona).regla }; })));
      }

      G._leccion_pantalla = { salieron: salieron, paso: function () { return paso; }, activo: function () { return activo; }, seguir: function () { bSeguir.click(); }, soltar: soltar,
        razones: function () { return Object.keys(porZona); }, otra: function () { bOtra.click(); }, hablando: function () { return !!pendiente; } };   /* solo pruebas */
      mira();
    }

    /* ---------- mecanica «cuento» (lecciones 4 y 6, aditiva) ----------
       Una escena ilustrada y 3 o 4 frases en ingles. Cada parte del cuento
       (persona, cosa, lugar, momento, razon) es un dibujo y un trozo de texto
       que se tocan; los dos cuentan igual. Pip pregunta en ingles (Who,
       What...) con la traduccion y el niño toca la respuesta. En mira, yo y
       juntos las partes llevan el color y el icono de su pregunta; en tu solo

       de rondas, una por cuento. */
    function leccionCuento(li) {
      var A = K(), L = cfg.lecciones[li], mio = token;
      var p = el('section', { class: 'al-pantalla le-pantalla le-pantalla--cuento' });

      p.appendChild(dialogo);

      var salieron = [];   /* solo pruebas */

      var cuentoAct = null, nodos = {}, costo = {};

      function marcarPaso(k) {

      /* el cuento: escena con dibujos tocables y frases con trozos tocables */

      function ponerPregunta(q) {

      /* 1 · MIRA: Pip lee el cuento resaltando cada frase y presenta las partes */

      /* 4 · TU SOLO: sin colores; un cuento por ronda */

          L.zonas.forEach(function (z) { if (costo[z] && R.extra[z]) items.push(copia(R.extra[z], { repuesto: true })); });

    /* ---------- mecanica «fichas» (leccion 5, hacer la pregunta, aditiva) ----------

      acciones.appendChild(bOtra); acciones.appendChild(bSeguir);
      dialogo.appendChild(pipCaja); dialogo.appendChild(texto); dialogo.appendChild(acciones);
      p.appendChild(dialogo);
      raiz.appendChild(p);

      var salieron = [];   /* solo pruebas */
      var paso = null, activo = null, actual = null, cola = [], ultima = null, pendiente = null, alSeguir = null, ayudado = false, ocupado = false;
      var huecos = [], puestas = [], repetidos = {}, siguiente = null;
      function vivo() { return mio === token && p.isConnected; }
      function despues(f, ms) { setTimeout(function () { if (vivo()) f(); }, espera(ms)); }
      function marcarPaso(k) {
        paso = k;
        Array.prototype.forEach.call(pasosBar.children, function (n) {
          var i = PASOS.indexOf(n.getAttribute('data-paso')), j = PASOS.indexOf(k);
          n.classList.toggle('le-paso--ahora', i === j); n.classList.toggle('le-paso--hecho', i < j);
        });

        (function uno() {

      function esperarSeguir(f) { bSeguir.disabled = false; bSeguir.classList.add('le-seguir--late'); alSeguir = f; despues(function () { try { bSeguir.focus({ preventScroll: true }); } catch (e) { /* nada */ } }, 50); }
