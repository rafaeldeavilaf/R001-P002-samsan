:root {
  --fondo: #EEF5FF; --papel: #FFFFFF; --ficha: #FFFFFF; --tinta: #1F2937; --suave: #4B5563; --linea: #1F2937; --sombra: #1F2937;
  --acento: #1D4ED8; --sobre-acento: #FFFFFF; --acento-claro: #DBEAFE; --ok: #15803D; --ok-claro: #DCFCE7;
  --brillo: #F59E0B; --sel: #FBBF24; --sobre-sel: #1F2937; --pool: rgba(255,255,255,.55); --hueco: rgba(255,255,255,.6);
  --pista-fondo: #FEF3C7; --pista-borde: #B45309; --pista-tinta: #1F2937; --estrella-vacia: #FFFFFF;
  --borde: 3px; --radio: 18px; --base: 1.15rem; --etiqueta: 'Nunito', system-ui, sans-serif;
}
html[data-tema="y6"] {
  --fondo: #0B1120; --papel: #111827; --ficha: #1E293B; --tinta: #E2E8F0; --suave: #94A3B8; --linea: #334155; --sombra: #020617;
  --acento: #A3E635; --sobre-acento: #0B1120; --acento-claro: #1A2E05; --ok: #A3E635; --ok-claro: #1A2E05;
  --brillo: #22D3EE; --sel: #22D3EE; --sobre-sel: #0B1120; --pool: rgba(15,23,42,.7); --hueco: rgba(30,41,59,.6);
  --pista-fondo: #2A2205; --pista-borde: #FBBF24; --pista-tinta: #FDE68A; --estrella-vacia: #1E293B;
  --borde: 2px; --radio: 14px; --base: 1.05rem; --etiqueta: 'Press Start 2P', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--tinta); font-family: 'Nunito', system-ui, sans-serif; font-size: var(--base); line-height: 1.4; -webkit-text-size-adjust: 100%; }
html[data-tema="y6"] body {
  background-color: var(--fondo);
  background-image: linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
button { font: inherit; color: inherit; }
.g-raiz { max-width: 760px; margin: 0 auto; padding: 10px 14px 24px; min-height: 100svh; }

/* ---------- barra superior ---------- */
.g-barra { display: flex; align-items: center; gap: 8px; min-height: 52px; margin-bottom: 8px; }
.g-barra h1 { flex: 1; margin: 0; font-size: 1.15rem; font-weight: 900; line-height: 1.15; }
.g-barra h1 small { display: block; font-size: .8rem; font-weight: 700; color: var(--suave); }
html[data-tema="y6"] .g-barra h1 small { font-family: var(--etiqueta); font-size: .5rem; color: #22D3EE; letter-spacing: .06em; margin-top: 5px; line-height: 1.5; text-transform: uppercase; }
.g-icono { min-width: 48px; min-height: 48px; border: var(--borde) solid var(--linea); border-radius: 50%; background: var(--papel); color: var(--tinta); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
html[data-tema="y6"] .g-icono { border-radius: 12px; }
.g-icono svg { width: 24px; height: 24px; }
.g-icono[aria-pressed="false"] { opacity: .5; position: relative; }
.g-icono[aria-pressed="false"]::after { content: ''; position: absolute; width: 60%; height: 3px; background: currentColor; transform: rotate(-45deg); border-radius: 2px; }

/* ---------- botones ---------- */
.g-btn { min-height: 52px; padding: 10px 22px; border: var(--borde) solid var(--linea); border-radius: 999px; background: var(--acento); color: var(--sobre-acento); font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0 var(--sombra); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
html[data-tema="y6"] .g-btn { border-radius: 14px; border-color: transparent; box-shadow: 0 4px 0 #4D7C0F, 0 0 22px rgba(163,230,53,.3); }
.g-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sombra); }
.g-btn--suave { background: var(--papel); color: var(--tinta); }
html[data-tema="y6"] .g-btn--suave { border-color: var(--linea); box-shadow: 0 4px 0 var(--sombra); }
.g-btn--grande { min-height: 64px; font-size: 1.25rem; width: 100%; }
:focus-visible { outline: 4px solid var(--brillo); outline-offset: 2px; }

/* ---------- mascota y globo ---------- */
.g-hola { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; cursor: pointer; }
.g-mascota { width: 112px; height: auto; flex-shrink: 0; overflow: visible; }
.g-mascota--chica { width: 70px; }
.g-globo { position: relative; margin: 0; background: var(--papel); border: var(--borde) solid var(--linea); border-radius: 20px; padding: 10px 14px; font-weight: 800; font-size: 1.05rem; }
.g-globo mark { background: none; color: var(--acento); font-weight: 900; box-shadow: none; padding: 0; }
.g-globo::before { content: ''; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--linea); border-left: 0; }
html[data-tema="y6"] .g-globo { border-color: #22D3EE; box-shadow: 0 0 18px rgba(34,211,238,.22); border-radius: 14px; }
html[data-tema="y6"] .g-globo::before { border-right-color: #22D3EE; }
.g-ojos { transform-box: fill-box; transform-origin: 50% 50%; animation: g-parpadeo 4.2s infinite; }
@keyframes g-parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.g-dron .g-cuerpo { animation: g-flota 2.4s ease-in-out infinite; }
.g-dron .g-propulsor { transform-box: fill-box; transform-origin: 50% 50%; animation: g-pulso 2.4s ease-in-out infinite; }
.g-dron .g-antena { animation: g-led 1.6s steps(2) infinite; }
@keyframes g-flota { 50% { transform: translateY(-6px); } }
@keyframes g-pulso { 50% { transform: scaleX(.8); opacity: .2; } }
@keyframes g-led { 50% { fill: #22D3EE; } }
.g-ala-d { transform-box: fill-box; transform-origin: 20% 80%; }
.g-mascota.salta { animation: g-salto .7s ease; }
.g-mascota.salta .g-ala-d { animation: g-saludo .35s ease-in-out 2 alternate; }
@keyframes g-salto { 30% { transform: translateY(-14px) rotate(-4deg); } 60% { transform: translateY(0); } }
@keyframes g-saludo { to { transform: rotate(-25deg); } }

/* ---------- XP (y6) ---------- */
.g-xp { background: var(--papel); border: var(--borde) solid var(--linea); border-radius: var(--radio); padding: 10px 12px; margin: 0 0 12px; text-align: left; }
.g-xp__fila { display: flex; justify-content: space-between; gap: 8px; font-family: var(--etiqueta); font-size: .55rem; color: var(--suave); margin-bottom: 8px; line-height: 1.6; text-transform: uppercase; }
.g-xp__fila b { color: #A3E635; font-weight: 400; white-space: nowrap; }
.g-xp__barra { height: 14px; border-radius: 7px; background: #1E293B; overflow: hidden; border: 1px solid var(--linea); }
.g-xp__barra i { display: block; height: 100%; background: linear-gradient(90deg, #22D3EE, #A3E635); box-shadow: 0 0 12px #A3E635; transition: width .8s ease; }
.g-xp-gana { font-family: var(--etiqueta); color: #A3E635; font-size: .9rem; margin: 6px 0 !important; text-shadow: 0 0 12px rgba(163,230,53,.6); }
.g-subio { font-family: var(--etiqueta); font-size: .6rem !important; color: #22D3EE; line-height: 1.7; }
.g-insignia { display: inline-flex; flex-direction: column; gap: 4px; padding: 8px 14px; border: 2px solid #FBBF24; border-radius: 12px; background: #2A2205; color: #FDE68A; font-weight: 900; }
.g-insignia small { font-family: var(--etiqueta); font-size: .5rem; font-weight: 400; color: #FBBF24; text-transform: uppercase; }

/* ---------- portada ---------- */
.g-seccion { font-size: 1.5rem; font-weight: 900; margin: 20px 0 0; line-height: 1.1; }
html[data-tema="y6"] .g-seccion { font-family: var(--etiqueta); font-size: .75rem; font-weight: 400; color: #22D3EE; letter-spacing: .08em; }
.g-misiones { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }

/* ordenar */

.g-hueco { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border: var(--borde) dashed var(--suave); border-radius: 14px; background: var(--hueco); }

/* tocar */

/* ============================================================
   SAMSAN — KIT DE LA ALDEA DE PIP (guias/comun/aldea.css)

.al-pantalla { display: flex; flex-direction: column; height: 100svh; max-width: 1100px; margin: 0 auto; padding: 8px 10px 10px; gap: 8px; }
.al-barra { display: flex; align-items: center; gap: 8px; min-height: 52px; }

/* ---------- escena ---------- */
.al-escena {
  position: relative; flex: 1; min-height: 0; overflow: hidden; container-type: size;
  border: 3px solid #1F2937; border-radius: 22px; background: linear-gradient(var(--cielo-1, #BAE6FD), var(--cielo-2, #F0F9FF));
  --suelo: 28%; --base: 16%; --ancho-lugar: min(23cqw, 27cqh, 180px);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;

<script>
/* ============================================================
   SAMSAN — KIT DE LA ALDEA DE PIP (guias/comun/aldea.js)

   Capa visual del «modo aldea» (Y2 English v3, propuesta del 18 nov 2026).
   Solo dibuja y anima; no lleva reglas de juego, voz ni textos visibles.
   Todo es vector por codigo (sin pixel art y sin archivos): los fondos se
   arman con capas que se estiran bien en vertical y en horizontal, y cada
   lugar es un boton con su propio SVG que se ajusta al alto disponible
   (container queries sobre .al-escena).

   Escenarios (A.escena):
     calle      casas            long i
     estanque   hojas            blends
     plaza      puestos          preguntas Wh
     habitat    arbol, agua, flores
     barrio     edificios        comunidad (panaderia, colegio, hospital, parque)
     granja     gallinero, agua, flores   ciclos de vida

   Lugares (A.lugar): casa, hoja, puesto, arbol, agua, flores, edificio
   (variantes panaderia, colegio, hospital, parque) y gallinero.

   Animaciones:
     A.abrir(lugar, icono)    se abre la puerta, sale el vecino, el dibujo
                              sube con confeti y queda en la ventana
     A.temblar(lugar)         error: tiembla suave, nunca se pierde nada
     A.brillar(lugar)         pista: brilla el lugar correcto
     A.entrar(globo)          Pip llega volando con el globo
     A.volar(globo, lugar)    el globo vuela a la puerta y se encoge
     A.celebrar(pip)          Pip da una voltereta
     A.confeti(x, y, n)       confeti desde un punto de la pantalla
     A.arrastre(nodo, op)     arrastre con el dedo o el raton, y toque

   Los colores base de Pip son los mismos del motor (#4A90D9, #2F6FA8,
   #CFE6FA), asi que los trajes (pieles) funcionan igual.
   ============================================================ */
(function () {

  try { MENOS_MOV = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* nada */ }
  A.menosMovimiento = function () { return MENOS_MOV; };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function marcas(s) { return esc(s).replace(/\*([^*]+)\*/g, '<mark>$1</mark>'); }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html) n.innerHTML = html; return n; }

  function anidar(icono, x, y, lado, cls) {

  }
  A.icono = function (icono, cls) { return '<svg class="' + (cls || 'al-ico') + '" viewBox="0 0 36 36" aria-hidden="true">' + (icono || '') + '</svg>'; };

  /* ---------- colores ---------- */
  function hex(c) { c = c.replace('#', ''); return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)]; }

      '<circle cx="59" cy="54" r="14.5" fill="#FFFFFF" stroke="' + K + '" stroke-width="2.5"/><circle cx="91" cy="54" r="14.5" fill="#FFFFFF" stroke="' + K + '" stroke-width="2.5"/>' +

    habitat:  { cielo: ['#BAE6FD', '#ECFDF5'], lejos: colinas('#BBF7D0', '#86EFAC'), suelo: 'prado', decor: '', base: 9 },

  A.entrar = function (nodo) { reiniciarClase(nodo, 'al-entra'); setTimeout(function () { nodo.classList.remove('al-entra'); }, 900); };

  /* El globo vuela a la puerta del lugar y se encoge; luego se quita. */

  A.abrir = function (lugar, icono, alTerminar) {

  /* ============================================================

     ============================================================ */
  A.arrastre = function (nodo, op) {

      if (e.button > 0 || nodo.disabled) return;

      if (!ini || e.pointerId !== ini.id) return;
      var dx = e.clientX - ini.x, dy = e.clientY - ini.y;

        Array.prototype.forEach.call(nodo.children, function (h) { var r = h.getBoundingClientRect(); h.style.transformOrigin = (ini.x - r.left) + 'px ' + (ini.y - r.top) + 'px'; });
        nodo.classList.add('al-arrastrando');

      marcar(lugarEn(e.clientX, e.clientY));
      e.preventDefault();
    });
    function fin(e, vale) {
      if (!ini || e.pointerId !== ini.id) return;
      var l = vale && movido ? lugarEn(e.clientX, e.clientY) : null, eraMov = movido;
      ini = null; marcar(null); nodo.classList.remove('al-arrastrando');
      if (eraMov) {
        nodo._sinClick = true; setTimeout(function () { nodo._sinClick = false; }, 60);
        if (l) { op.alSoltar && op.alSoltar(l); }
        else { nodo.style.transition = 'transform .25s ease'; nodo.style.transform = ''; setTimeout(function () { nodo.style.transition = ''; }, 260); }
      }
    }
    nodo.addEventListener('pointerup', function (e) { fin(e, true); });
    nodo.addEventListener('pointercancel', function (e) { fin(e, false); });
    nodo.addEventListener('click', function (e) { if (nodo._sinClick) { e.preventDefault(); return; } op.alTocar && op.alTocar(); });
  };
})();

<script>
/* ============================================================
   SAMSAN — MOTOR DE LAS GUIAS DE ESTUDIO (guias/comun/guia.js)

   Una guia es una lista de misiones (un tema del colegio cada una).
   Cada mision tiene una tarjeta "Aprende" y varias actividades de accion:
     clasificar  llevar cada ficha a su caja
     ordenar     poner las fichas en su orden
     emparejar   unir cada ficha de la izquierda con su pareja
     tocar       tocar en la frase las palabras que se piden (o la que esta mal, para arreglarla)
     completar   llenar los espacios de una frase con fichas
   Las fichas se tocan o se arrastran. No hay opcion multiple ni puntaje
   frente al nino: solo se guarda que actividades se terminaron.

   Variedad (18 nov 2026): cada actividad trae un banco y `muestra` dice
   cuantos salen por vuelta (en clasificar, repartidos por caja); `variantes`
   elige una version al azar (otro cuento, otro ciclo de vida). Al terminar,
   "New round" saca otra tanda. `jefe` arma una mision final con una
   actividad al azar de cada mision (Boss round / repaso final).

   XP (opcional, `xp`): 50 por actividad terminada, sin importar errores ni
   intentos (regla 4 del repo). Niveles e insignias salen de eso.

   Musica de fondo por codigo (WebAudio), sin archivos: estilos `alegre` y
   `synth`. Arranca con el primer toque, baja cuando habla la voz y se apaga
   con su boton (se recuerda).

   Ayuda en tres peldaños (boton de la bombilla, o solo tras dos errores):
     1) la pista escrita  2) brilla una jugada correcta  3) se hace una jugada.

   Marcas en los textos:
     *texto*          resaltado en Aprende; objetivo en `tocar`
     *mal|bien*       en `tocar`: palabra equivocada que se arregla al tocarla
     [respuesta]      en `completar`: un espacio a llenar; [a|b] acepta a o b

   Uso:  GUIA.iniciar({ id, lang, tema, mascota, titulo, subtitulo, saludo, textos, misiones, jefe, xp, musica })
   ============================================================ */
(function () {
  'use strict';
  var G = window.GUIA = {};
  var cfg = null, raiz = null, hechas = {}, vozOn = true, musicaOn = true, voces = [], racha = 0;
  var MENOS_MOV = false;
  try { MENOS_MOV = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* nada */ }

  /* ---------- utilidades ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function el(tag, attrs, hijos) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) { if (h) n.appendChild(typeof h === 'string' ? document.createTextNode(h) : h); });
    return n;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function marcas(s) { return esc(s).replace(/\*([^*]+)\*/g, '<mark>$1</mark>'); }
  function plano(s) { return String(s).replace(/[*\[\]]/g, '').replace(/\|[^\s*]*/g, ''); }
  function mezclar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function desordenar(a) {
    if (a.length < 2) return a.slice();
    var b; do { b = mezclar(a); } while (b.every(function (x, i) { return x === a[i]; }));
    return b;
  }
  function copiar(o) { var r = {}; Object.keys(o).forEach(function (k) { r[k] = o[k]; }); return r; }
  function t(k) { return (cfg.textos && cfg.textos[k]) || TEXTOS[cfg.idioma][k] || TEXTOS.en[k]; }
  var TEXTOS = {

  /* ---------- efectos: vuelo de la ficha y chispas ---------- */
  function centro(n) { var r = n.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r }; }
  function volar(desde, hasta) {
    if (MENOS_MOV || !desde || !hasta) return;
    try {
      var a = centro(desde), b = centro(hasta);
      if (!a.r.width) return;
      var c = desde.cloneNode(true);
      c.classList.add('g-vuelo'); c.removeAttribute('id');
      c.style.left = a.r.left + 'px'; c.style.top = a.r.top + 'px'; c.style.width = a.r.width + 'px';
      document.body.appendChild(c);
      requestAnimationFrame(function () {

      });

  }
  function chispas(n) {

    try {

        document.body.appendChild(s);

  /* ---------- arrastrar y soltar (ademas de tocar) ---------- */
  function arrastrable(f, alSoltar) {
    var ini = null, fant = null, movio = false, sobre = null;
    f.classList.add('g-arrastra');
    f.addEventListener('click', function (e) { if (f._sinClick) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
    function destinoEn(x, y) {
      var bajo = document.elementFromPoint && document.elementFromPoint(x, y);
      return bajo && bajo.closest ? bajo.closest('[data-destino]') : null;
    }
    /* el movimiento se sigue en la ventana: el dedo sale de la ficha enseguida */
    function mover(e) {
      if (!ini || e.pointerId !== ini.id) return;
      if (!movio && Math.abs(e.clientX - ini.x) + Math.abs(e.clientY - ini.y) < 12) return;
      if (!movio) {
        movio = true;
        var r = f.getBoundingClientRect();
        fant = f.cloneNode(true); fant.classList.add('g-fantasma'); fant.removeAttribute('id');
        fant.style.width = r.width + 'px'; fant._dx = ini.x - r.left; fant._dy = ini.y - r.top;
        document.body.appendChild(fant); f.classList.add('g-origen');
      }
      if (e.cancelable) e.preventDefault();
      fant.style.left = (e.clientX - fant._dx) + 'px'; fant.style.top = (e.clientY - fant._dy) + 'px';
      var d = destinoEn(e.clientX, e.clientY);
      if (d !== sobre) { if (sobre) sobre.classList.remove('g-sobre'); sobre = d; if (sobre) sobre.classList.add('g-sobre'); }
    }
    function soltarAqui(e) { if (ini && e.pointerId === ini.id) fin(e, true); }
    function cancelar(e) { if (ini && e.pointerId === ini.id) fin(e, false); }

      window.removeEventListener('pointermove', mover);
      window.removeEventListener('pointerup', soltarAqui);
      window.removeEventListener('pointercancel', cancelar);
    }
    f.addEventListener('pointerdown', function (e) {

      window.addEventListener('pointermove', mover, { passive: false });
      window.addEventListener('pointerup', soltarAqui);
      window.addEventListener('pointercancel', cancelar);
    });
    function fin(e, soltar) {
      quitar();
      if (!ini) return;
      var era = movio; ini = null; movio = false;
      if (!era) return;
      if (fant) fant.remove(); fant = null; f.classList.remove('g-origen');
      if (sobre) sobre.classList.remove('g-sobre'); sobre = null;
      f._sinClick = true; setTimeout(function () { f._sinClick = false; }, 60);
      var d = soltar ? destinoEn(e.clientX, e.clientY) : null;
      if (d) alSoltar(d);
    }
  }
